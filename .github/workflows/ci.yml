name: ci

# test    -> backend suite on SQLite and on Postgres 17
# image   -> docker build + smoke test of the built container (no AWS needed)
# push    -> push the image to ECR. Skipped until the repository variable
#            AWS_ROLE_ARN exists (see docs/configuration.md, "CI / ECR").

on:
  push:
    branches: [main, feat/aws-deployment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  IMAGE: recon-engine:ci

jobs:
  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        env:
          RECON_DATA_DIR: ${{ runner.temp }}/recon-data
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/recon_test' || '' }}
        # The golden-master gate and the two tests built on it need the real
        # sample documents, which are business data and never in git. They
        # stay mandatory on developer machines (CLAUDE.md); CI deselects
        # exactly those, by name, instead of weakening them to skips.
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_golden.py
          --deselect tests/test_incremental.py::test_incremental_scenario
          --deselect tests/test_reconcile_gold.py::test_snapshot_from_gold_matches_legacy_pipeline

  image:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: no data or secrets inside the image
        run: |
          found=$(docker run --rm --entrypoint sh "$IMAGE" -c \
            'find /app \( -name "*.xlsx" -o -name "*.xls" -o -name "*.pdf" -o -name "*.PDF" \
               -o -name "*.csv" -o -name "*.db" -o -name "*.log" -o -name ".env" -o -name ".env.*" \
               -o -path "*/tests*" -o -path "*/node_modules*" \) -print')
          if [ -n "$found" ]; then echo "::error::unexpected files in image:"; echo "$found"; exit 1; fi
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          [ "$uid" = "10001" ] || { echo "::error::container runs as uid $uid, expected 10001"; exit 1; }

      - name: migrate task against Postgres (the one-off ECS task)
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=recon \
            -e DB_USER=postgres -e DB_PASSWORD=postgres \
            "$IMAGE" python -m db.migrate

      - name: app container serves UI and API
        run: |
          docker run -d --name recon --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=recon \
            -e DB_USER=postgres -e DB_PASSWORD=postgres \
            "$IMAGE"
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done
          # capture, then grep a here-string: `curl | grep -q` can fail under
          # the runner's pipefail when grep exits before curl finishes writing
          health=$(curl -fsS http://localhost:8080/api/health)
          grep -q '"status":"ok"' <<<"$health"
          index=$(curl -fsS http://localhost:8080/)
          grep -q 'id="root"' <<<"$index"
          asset=$(grep -o '/assets/[^"]*\.js' <<<"$index" | head -n1)
          [ -n "$asset" ] || { echo "::error::no JS asset referenced by index.html"; exit 1; }
          headers=$(curl -fsS -o /dev/null -D - "http://localhost:8080$asset")
          grep -qi 'cache-control: public, max-age=31536000, immutable' <<<"$headers"
          customers=$(curl -fsS http://localhost:8080/api/customers)
          grep -q '"key":"default"' <<<"$customers"
          # structured JSON logs on stdout (LOG_FORMAT=json baked into the image)
          logs=$(docker logs recon 2>&1)
          grep -q '"event_type": "frontend.mounted"' <<<"$logs"

      - name: container logs
        if: always()
        run: docker logs recon 2>&1 | tail -n 100 || true

  push:
    runs-on: ubuntu-latest
    needs: image
    # set repository variable AWS_ROLE_ARN (and optionally AWS_REGION,
    # ECR_REPOSITORY) to turn this on
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write          # OIDC: no AWS keys stored in GitHub
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # Tagged with the full commit SHA only: the ECS task definition then
      # names an exact build, and it works with immutable ECR tags.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'wabtec/recon-engine' }}:${{ github.sha }}
          cache-from: type=gha
          provenance: false

      - name: image reference
        run: echo "::notice::pushed ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'wabtec/recon-engine' }}:${{ github.sha }}"
